<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Timeline</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="logo">⏳ Time Traveller</div>

  <div class="menu">
    <a href="index.html">Home</a>
    <a href="timeline.html" class="active">Timeline</a>
    <a href="favorites.html">Favorites</a>
    <a href="about.html">About</a>
  </div>

  <!-- 🌙 Theme Button -->
  <button onclick="toggleTheme()">🌙</button>
</nav>

<!-- ================= MAIN ================= -->
<div class="container">
  <h1>Timeline</h1>

  <div class="controls">
    <input type="number" id="yearInput" placeholder="Enter Year">
    <button onclick="loadEvents()">Fetch Events</button>

    <input type="text" id="search" placeholder="Search events...">

    <select id="sort">
      <option value="">Sort</option>
      <option value="asc">A → Z</option>
      <option value="desc">Z → A</option>
    </select>
  </div>

  <div id="timeline"></div>
</div>

<!-- ✅ ONLY ONE app.js (IMPORTANT) -->
<script src="app.js"></script>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800 });
</script>

<!-- ================= FOOTER ================= -->
<footer style="text-align:center; padding:20px; opacity:0.6;">
  Made by Ayan Ahmad | History Timeline Project
</footer>

</body>
</html>
